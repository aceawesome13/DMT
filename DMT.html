<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dot Memory</title>

  <script src="https://unpkg.com/jspsych@7.3.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-html-button-response@1.1.2"></script>
 <script src="https://unpkg.com/@jspsych/extension-pipe@0.2.0"></script>
  <script src="https://unpkg.com/@jspsych/plugin-survey-text@1.1.2"></script>
  <script src="https://unpkg.com/@jspsych/plugin-fullscreen@1.1.2"></script>

  <link href="https://unpkg.com/jspsych@7.3.2/css/jspsych.css" rel="stylesheet" />

  <style>
    .grid {
      display: grid;
      grid-template-columns: repeat(5, 60px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }

    .cell {
      width: 60px;
      height: 60px;
      border: 1px solid black;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }

    .distraction-cell {
      width: 60px;
      height: 60px;
      border: none;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      cursor: pointer;
      user-select: none;
    }

    .circle {
      width: 35px;
      height: 35px;
      background: red;
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    #done {
      display: block;
      margin: 20px auto;
      padding: 10px 20px;
      font-size: 20px;
    }

    .jspsych-btn {
      font-size: 20px;
      padding: 10px 20px;
    }
  </style>
</head>

<body></body>

<script>

 const jsPsych = initJsPsych({

  extensions: [
    {
      type: jsPsychExtensionPipe,
      params: {

        experiment_id: "8vGt7oHuZjuJ",

        filename: () =>
          `dot_${participant_id}_day${dayNumber}.csv`

      }
    }
  ],

  on_finish: function() {
    console.log(jsPsych.data.get().values());
  }

});


  const expID = "8vGt7oHuZjuJ";

  let participant_id = "";

  // =========================
  // Day 저장 변수
  // =========================
  let dayNumber = 1;

  let encoding_positions = [];
  let userSelections = [];

  // =========================
  // F 클릭 횟수
  // =========================
  let fClickCount = 0;

let trialNumber = 0;
let trialResults = [];
  // =========================
  // Day별 Dot 위치
  // =========================
  const allDayPositions = {

    // Day 1
    1: [
      [[4,0],[3,1],[2,2]],
      [[4,2],[4,3],[4,4]],
      [[1,0],[1,1],[2,2]]
    ],

    // Day 2
    2: [
      [[0,0],[1,1],[3,3]],
      [[2,0],[2,4],[4,2]],
      [[0,4],[2,2],[4,0]]
    ],

    // Day 3
    3: [
      [[0,1],[2,3],[4,2]],
      [[0,0],[1,2],[3,4]],
      [[1,4],[3,0],[0,1]]
    ]

  };


  // 실제 사용할 문제
  let predefinedEncodingPositions = [];

  let currentSetIndex = 0;


  const fullscreen = {
    type: jsPsychFullscreen,
    message: '<p style="font-size: 24px;">2全画表示に切り替えます</p>',
    button_label: "開始",
    fullscreen_mode: true
  };


  // =========================
  // ID + Day 입력
  // =========================
  const form_trial = {

    type: jsPsychSurveyText,

    questions: [

      {
        prompt: '<p style="font-size: 24px;">参加者IDを入力してください</p>',
        name: "ID",
        required: true
      },

      {
        prompt: '<p style="font-size: 24px;">Dayを入力してください（1〜3）</p>',
        name: "Day",
        required: true
      }

    ],

    button_label: "次へ",

    on_finish: function(data) {

      participant_id = data.response.ID;

      dayNumber = parseInt(data.response.Day);

      // Day에 해당하는 Dot 문제 선택
      predefinedEncodingPositions =
        allDayPositions[dayNumber];

      // Day 바뀔 때 trial index 초기화
      currentSetIndex = 0;

      // 전체 데이터에 ID와 Day 추가
      jsPsych.data.addProperties({
        participant_id: participant_id,
        day: dayNumber
      });

    }
  };


  const welcome = {
    type: jsPsychHtmlButtonResponse,
    stimulus:
      "<p style='font-size:15pt;'>3つの点の位置を覚えてください。</p>" +
      "<img src='/datapipe/ex_01.png' style='width:350px; height:350px;'>",
    choices: ["次へ"]
  };


  const instruction = {
    type: jsPsychHtmlButtonResponse,
    stimulus:
      "<p style='font-size:15pt;'>画面上のFをできるだけ早く押してください。</p>" +
      "<img src='/datapipe/ex_02.png' style='width:350px; height:350px;'>",
    choices: ["スタート"]
  };


  // =========================
  // Encoding
  // =========================
  const encoding = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: function() {

  trialNumber++;

      encoding_positions =
        predefinedEncodingPositions[currentSetIndex];

      currentSetIndex =
        (currentSetIndex + 1)
        % predefinedEncodingPositions.length;

      let html =
        '<p style="font-size: 24px;">点の位置を覚えてください</p>' +
        '<div class="grid">';

      for (let i = 0; i < 25; i++) {

        const x = i % 5;
        const y = Math.floor(i / 5);

        html += "<div class='cell'>";

        if (
          encoding_positions.some(
            p => p[0] === x && p[1] === y
          )
        ) {
          html += "<div class='circle'></div>";
        }

        html += "</div>";
      }

      html += "</div>";

      return html;
    },

    choices: "NO_KEYS",

    trial_duration: 3000,

    data: {
      task: "encoding"
    }

  };


  // =========================
  // Distraction
  // =========================
  const distraction = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: function() {

      let html =
        '<p style="font-size: 24px;">Fを押してください</p>' +
        '<div class="grid">';

      for (let i = 0; i < 30; i++) {

        const letter =
          Math.random() < 0.6 ? "F" : "E";

        html += `
          <div
            class="distraction-cell"
            data-letter="${letter}">
            ${letter}
          </div>
        `;
      }

      html += "</div>";

      return html;
    },

    choices: "NO_KEYS",

    trial_duration: 8000,


    // trial 시작할 때 F 클릭 수 0으로 초기화
    on_start: function() {

      fClickCount = 0;

    },


    // F를 클릭할 때마다 +1
    on_load: function() {

      document
        .querySelectorAll(".distraction-cell")
        .forEach(cell => {

          cell.addEventListener("click", () => {

            const clickedLetter =
              cell.dataset.letter;

            if (clickedLetter === "F") {

              fClickCount++;

              cell.textContent = "E";

              cell.dataset.letter = "E";

            }

          });

        });
    },


    // =========================
    // F 클릭 횟수 저장
    // =========================
    on_finish: function(data) {

      data.task = "distraction";

      data.f_click_count = fClickCount;

      data.participant_id = participant_id;

      data.day = dayNumber;

    }

  };


  const rest_20s = {

    type: jsPsychHtmlKeyboardResponse,

    stimulus: "",

    choices: "NO_KEYS",

    trial_duration: 500

  };


const retrieval = {

  type: jsPsychHtmlKeyboardResponse,

  stimulus: function() {

    userSelections = [];

    let html = `
      <p style="font-size: 24px;">
        点はどこにありましたか？
      </p>

      <div class="grid">
    `;

    for (let i = 0; i < 25; i++) {

      html += `
        <div
          class="cell"
          data-index="${i}">
        </div>
      `;
    }

    html += `
      </div>

      <button id="done" disabled>
        完了
      </button>
    `;

    return html;
  },

  choices: "NO_KEYS",

  on_load: function() {

    const doneButton =
      document.getElementById("done");

    document
      .querySelectorAll(".cell")
      .forEach((cell, i) => {

        cell.addEventListener("click", () => {

          if (cell.querySelector(".circle")) {

            cell.innerHTML = "";

            userSelections =
              userSelections.filter(
                x => x !== i
              );

          } else {

            cell.innerHTML =
              "<div class='circle'></div>";

            userSelections.push(i);

          }

          doneButton.disabled =
            (userSelections.length !== 3);

        });

      });


    doneButton.addEventListener(
      "click",
      () => {

        if (userSelections.length === 3) {

          // index를 [x,y] 좌표로 변환
          const response_positions =
            userSelections.map(index => {

              const x = index % 5;
              const y = Math.floor(index / 5);

              return [x, y];

            });


          // 한 trial의 결과 저장
          trialResults.push({

            participant_id: participant_id,

            day: dayNumber,

            trial: trialNumber,

            encoding_positions:
              JSON.stringify(encoding_positions),

            f_click_count:
              fClickCount,

            response:
              JSON.stringify(response_positions)

          });

          jsPsych.finishTrial({

            task: "retrieval",

            participant_id:
              participant_id,

            day:
              dayNumber,

            trial:
              trialNumber,

            response:
              JSON.stringify(response_positions),

            encoding_positions:
              JSON.stringify(encoding_positions)

          });

        }

      });

  }

};



  const debrief = {

    type: jsPsychHtmlButtonResponse,

    stimulus:
      "<p>下の課題完了ボタンを押た後、ブラウザを閉じて終了してください。ありがとうございました。</p>",

    choices: ["課題完了"]

  };



  // =========================
  // Timeline
  // =========================
  const timeline = [];
  timeline.push(fullscreen);
  timeline.push(form_trial);
  timeline.push(welcome);
  timeline.push(instruction);


  // 하루 3 trial
  for (let i = 0; i < 2; i++) {

    timeline.push(encoding);
    timeline.push(distraction);
    timeline.push(rest_20s);
    timeline.push(retrieval);

  }


  timeline.push(debrief);

jsPsych.run(timeline);

</script>

</html>
